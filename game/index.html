<title>Day of the Smudgies</title>
<style>
  @font-face {
    font-family: "Pixelify Sans";
    src: url(fonts/pixelify-sans-latin-400-normal.woff2) format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Pixelify Sans";
    src: url(fonts/pixelify-sans-latin-600-normal.woff2) format("woff2");
    font-weight: 600;
  }
  body {
    padding: 0 !important;
    gap: 0 !important;
    background: #000 !important;
  }
  .bar {
    display: none !important;
  }
  #stage {
    width: min(100vw, calc(100vh * 1.6)) !important;
    box-shadow: none !important;
  }
</style>
<style>
  /* Layout: one letterboxed 320x200 VGA screen floating in a dark void, a hint line underneath */
  :root {
    --void: #08070d;
    --ink: #e9e2cf;
    --dim: #7d768c;
    --gold: #ffd23a;
    --frame: #1d1a2a;
    --pix: "Pixelify Sans", ui-monospace, "Courier New", monospace;
    color-scheme: dark;
  }
  html,
  body {
    height: 100%;
  }
  body {
    background: var(--void);
    color: var(--ink);
    font-family: var(--pix);
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding-inline: 16px;
    padding-block: 12px;
    box-sizing: border-box;
  }
  #stage {
    position: relative;
    width: min(100%, 1280px, calc((100vh - 80px) * 1.6));
    width: min(100%, 1280px, calc((100dvh - 80px) * 1.6));
    aspect-ratio: 320/200;
    max-width: 100%;
    background: #000;
    box-shadow:
      0 0 0 3px var(--frame),
      0 0 0 4px #000,
      0 18px 60px rgba(0, 0, 0, 0.6);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
  }
  #stage:focus-visible {
    box-shadow: 0 0 0 3px var(--gold);
  }
  @media (pointer: fine) {
    #stage {
      cursor: none;
    }
  }
  #stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #px {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .hint {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--dim);
    text-align: center;
    text-wrap: balance;
    max-width: 72ch;
  }
  .hint b {
    color: var(--gold);
    font-weight: 600;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px 18px;
    max-width: 100%;
  }
  .audio {
    display: flex;
    gap: 8px;
  }
  .audio button {
    font-family: var(--pix);
    font-size: 13px;
    letter-spacing: 0.06em;
    color: var(--ink);
    background: #14111e;
    border: 1px solid #2e2842;
    padding: 5px 12px;
    cursor: pointer;
    border-radius: 0;
    box-shadow: 2px 2px 0 #000;
  }
  .audio button[aria-pressed="false"] {
    color: var(--dim);
    text-decoration: line-through;
  }
  .audio button:hover {
    border-color: var(--gold);
  }
  .audio button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
</style>
<div
  id="stage"
  tabindex="0"
  aria-label="Day of the Smudgies, a point-and-click adventure"
>
  <canvas id="px" width="320" height="200"></canvas
  ><canvas id="tx" width="1280" height="800"></canvas>
</div>
<div class="bar">
  <p class="hint">
    <b>Click</b> anything: verb wheel · <b>Right-click</b> looks ·
    <b>Hover + L U P O C T G S Y</b> · <b>Esc</b> skips · <b>M</b> music
  </p>
  <div class="audio">
    <button id="bMus" type="button" aria-pressed="true">Music</button
    ><button id="bSfx" type="button" aria-pressed="true">SFX</button
    ><button id="bVox" type="button" aria-pressed="true">Voices</button>
  </div>
</div>
<script>
  const VO_PACKS = [
    "vo1.js",
    "vo2.js",
    "vo3.js",
    "vo4.js",
    "vo5.js",
    "vo6.js",
    "vo7.js",
    "vo8.js",
    "vo9.js",
  ];
  (() => {
    "use strict";
    const $ = (id) => document.getElementById(id);
    const stage = $("stage"),
      PX = $("px"),
      TXC = $("tx");
    const gx = PX.getContext("2d"),
      tx = TXC.getContext("2d");
    gx.imageSmoothingEnabled = false;
    const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let G = gx,
      NOW = 0;
    const VH = 144;

    /* ---------- audio: adaptive synth score + comic SFX ---------- */
    const AU = {
      ac: null,
      mus: null,
      fx: null,
      NB: null,
      musicOn: true,
      sfxOn: true,
      cur: null,
      song: null,
      step: 0,
      next: 0,
      g: null,
      pending: null,
    };
    try {
      const p = JSON.parse(localStorage.getItem("dots-audio") || "{}");
      if (p.m === false) AU.musicOn = false;
      if (p.s === false) AU.sfxOn = false;
    } catch (e) {}
    function auSave() {
      try {
        localStorage.setItem(
          "dots-audio",
          JSON.stringify({ m: AU.musicOn, s: AU.sfxOn }),
        );
      } catch (e) {}
    }
    function unlock() {
      if (AU.ac) {
        if (AU.ac.state === "suspended") AU.ac.resume();
        return;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ac = new AC();
      AU.ac = ac;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14;
      comp.ratio.value = 4;
      comp.connect(ac.destination);
      const master = ac.createGain();
      master.gain.value = 0.9;
      master.connect(comp);
      AU.mus = ac.createGain();
      AU.mus.gain.value = AU.musicOn ? 0.5 : 0;
      AU.mus.connect(master);
      AU.fx = ac.createGain();
      AU.fx.gain.value = 0.75;
      AU.fx.connect(master);
      const len = ac.sampleRate * 2,
        b = ac.createBuffer(1, len, ac.sampleRate),
        d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      AU.NB = b;
      setInterval(tick, 25);
      if (AU.pending !== null) {
        const p = AU.pending;
        AU.pending = null;
        music(p);
      }
    }
    document.addEventListener("visibilitychange", () => {
      if (!AU.ac) return;
      if (document.hidden) AU.ac.suspend();
      else AU.ac.resume();
    });
    function env(g, t, v, a, d, rel, sus) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(v, t + a);
      if (sus) {
        g.gain.linearRampToValueAtTime(v * sus, t + Math.max(a + 0.01, d));
        g.gain.linearRampToValueAtTime(0.0001, t + Math.max(a + 0.01, d) + rel);
      } else
        g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(a + 0.01, d));
    }
    function O(type, f, t, dur, v, dest, o) {
      o = o || {};
      const ac = AU.ac,
        os = ac.createOscillator();
      os.type = type;
      os.frequency.setValueAtTime(f, t);
      if (o.f1)
        os.frequency.exponentialRampToValueAtTime(o.f1, t + (o.fd || dur));
      if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
      if (o.det) os.detune.value = o.det;
      let n = os;
      if (o.lp || o.bp || o.hp) {
        const fl = ac.createBiquadFilter();
        fl.type = o.lp ? "lowpass" : o.bp ? "bandpass" : "highpass";
        fl.frequency.value = o.lp || o.bp || o.hp;
        fl.Q.value = o.q || 0.8;
        if (o.fenv) {
          fl.frequency.setValueAtTime(o.fenv[0], t);
          fl.frequency.linearRampToValueAtTime(o.fenv[1], t + 0.04);
          fl.frequency.exponentialRampToValueAtTime(o.fenv[2], t + 0.3);
        }
        n.connect(fl);
        n = fl;
      }
      const rel = o.rel || 0.06,
        end = t + Math.max(dur, (o.a || 0.004) + 0.01) + rel + 0.05;
      if (o.vib) {
        const l = ac.createOscillator(),
          lg = ac.createGain();
        l.frequency.value = o.vib[0];
        lg.gain.setValueAtTime(0, t);
        lg.gain.linearRampToValueAtTime(o.vib[1], t + (o.vib[2] || 0.15));
        l.connect(lg);
        lg.connect(os.detune);
        l.start(t);
        l.stop(end);
      }
      const g = ac.createGain();
      env(g, t, v, o.a || 0.004, dur, rel, o.sus);
      n.connect(g);
      g.connect(dest);
      os.start(t);
      os.stop(end);
    }
    function N(t, dur, v, dest, o) {
      o = o || {};
      const ac = AU.ac,
        s = ac.createBufferSource();
      s.buffer = AU.NB;
      s.loop = true;
      const fl = ac.createBiquadFilter();
      fl.type = o.type || "bandpass";
      fl.frequency.setValueAtTime(o.f || 1000, t);
      if (o.f1) fl.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
      fl.Q.value = o.q || 1;
      const g = ac.createGain();
      env(g, t, v, o.a || 0.002, dur, o.rel || 0.05, o.sus);
      s.connect(fl);
      fl.connect(g);
      g.connect(dest);
      s.start(t, Math.random() * 1.5);
      s.stop(t + dur + 0.25);
    }
    function FM(f, t, dur, v, dest, ratio, idx, idec, car) {
      const ac = AU.ac,
        c = ac.createOscillator(),
        m = ac.createOscillator(),
        mg = ac.createGain(),
        g = ac.createGain();
      c.type = car || "sine";
      c.frequency.value = f;
      m.frequency.value = f * ratio;
      mg.gain.setValueAtTime(f * idx, t);
      mg.gain.exponentialRampToValueAtTime(
        Math.max(0.5, f * idx * 0.03),
        t + idec,
      );
      m.connect(mg);
      mg.connect(c.frequency);
      env(g, t, v, 0.004, dur);
      c.connect(g);
      g.connect(dest);
      c.start(t);
      m.start(t);
      c.stop(t + dur + 0.05);
      m.stop(t + dur + 0.05);
    }
    const INST = {
      marimba: (f, t, d, v, o) => {
        FM(f, t, Math.min(0.9, Math.max(0.35, d)), v, o, 4, 1.8, 0.05);
        FM(f, t, Math.min(0.9, Math.max(0.3, d)), v * 0.5, o, 1, 0.6, 0.12);
      },
      pizz: (f, t, d, v, o) => O("triangle", f, t, 0.22, v, o, { lp: 2200 }),
      bass: (f, t, d, v, o) =>
        FM(f, t, Math.min(1.4, d + 0.08), v, o, 1, 1.4, 0.14, "triangle"),
      lead: (f, t, d, v, o) =>
        O("square", f, t, d, v, o, {
          lp: 2400,
          a: 0.01,
          sus: 0.75,
          rel: 0.08,
          vib: [5.5, 12, 0.18],
        }),
      brass: (f, t, d, v, o) => {
        O("sawtooth", f, t, d, v, o, {
          lp: 1200,
          fenv: [300, 2400, 1100],
          a: 0.03,
          sus: 0.8,
          rel: 0.1,
        });
        O("sawtooth", f, t, d, v * 0.6, o, {
          lp: 1200,
          det: 9,
          a: 0.03,
          sus: 0.8,
          rel: 0.1,
        });
      },
      organ: (f, t, d, v, o) => {
        O("sine", f, t, d, v, o, { a: 0.02, sus: 0.9, rel: 0.12 });
        O("sine", f * 2, t, d, v * 0.45, o, { a: 0.02, sus: 0.9, rel: 0.12 });
        O("triangle", f * 3, t, d, v * 0.18, o, {
          a: 0.02,
          sus: 0.9,
          rel: 0.12,
        });
      },
      chip: (f, t, d, v, o) =>
        O("square", f, t, Math.min(d, 0.2), v, o, {
          a: 0.002,
          sus: 0.6,
          rel: 0.03,
        }),
      tri: (f, t, d, v, o) =>
        O("triangle", f, t, d * 0.9, v, o, { a: 0.005, sus: 0.85, rel: 0.05 }),
    };
    const DR = {
      k: (t, v, o) => O("sine", 150, t, 0.28, v, o, { f1: 42, fd: 0.12 }),
      s: (t, v, o) => {
        N(t, 0.14, v * 0.7, o, { f: 1800, q: 0.7 });
        O("triangle", 190, t, 0.08, v * 0.5, o, { f1: 140 });
      },
      h: (t, v, o) => N(t, 0.035, v * 0.35, o, { type: "highpass", f: 7500 }),
      o: (t, v, o) => N(t, 0.2, v * 0.3, o, { type: "highpass", f: 7000 }),
      r: (t, v, o) => N(t, 0.06, v * 0.25, o, { type: "highpass", f: 9000 }),
      t: (t, v, o) => {
        O("sine", 96, t, 0.9, v, o, { f1: 72, fd: 0.5 });
        N(t, 0.18, v * 0.4, o, { type: "lowpass", f: 400 });
      },
      c: (t, v, o) => {
        for (let i = 0; i < 3; i++)
          N(t + i * 0.012, 0.08, v * 0.5, o, { f: 1300, q: 2 });
      },
    };
    const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    function nf(n) {
      const m = n.match(/^([A-G])([#b]?)(-?\d)$/);
      if (!m) return 0;
      const sm = SEMI[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0);
      return 440 * Math.pow(2, (12 * (+m[3] + 1) + sm - 69) / 12);
    }
    function trk(inst, vol, pat, drum) {
      const ev = {};
      let p = 0;
      pat
        .replace(/\|/g, " ")
        .trim()
        .split(/\s+/)
        .forEach((tok) => {
          const [body, mul] = tok.split("*");
          const len = mul ? +mul : 1;
          if (body !== ".") {
            (ev[p] = ev[p] || []).push(
              drum ? { d: body, len } : { f: body.split("+").map(nf), len },
            );
          }
          p += len;
        });
      return { inst, vol, ev, len: p, drum: !!drum };
    }
    function song(bpm, swing, tracks) {
      return { bpm, swing, tracks };
    }
    const SONGS = {
      title: song(128, 0.12, [
        trk(
          "marimba",
          0.32,
          "C5 . Eb5 G5 . F5 Eb5 C5 | D5*2 B4 . G4*4 | C5 . Eb5 G5 . Ab5 G5 F5 | G5*6 .*2 | Ab5 . G5 F5 . Eb5 D5 Eb5 | F5*2 D5 . Bb4*4 | C5 D5 Eb5 F5 G5 . B4 . | C5*6 .*2",
        ),
        trk(
          "bass",
          0.38,
          "C3 . G2 . C3 . G2 . | G2 . D3 . G2 . B2 . | C3 . G2 . Ab2 . Ab2 . | G2 . G2 . G2 F2 Eb2 D2 | Ab2 . Eb3 . Ab2 . Eb3 . | Bb2 . F3 . Bb2 . D3 . | Ab2 . Ab2 . G2 . G2 . | C3 . G2 . C3 . . .",
        ),
        trk(
          "organ",
          0.05,
          "C4+Eb4+G4*8 | B3+D4+G4*8 | C4+Eb4+Ab4*8 | B3+D4+G4*8 | C4+Eb4+Ab4*8 | Bb3+D4+F4*8 | C4+Eb4+Ab4*4 B3+D4+G4*4 | C4+Eb4+G4*8",
        ),
        trk(null, 0.5, "k h s h k k s h", 1),
      ]),
      fanfare: song(138, 0, [
        trk(
          "brass",
          0.2,
          "C5 . C5 C5 G5*4 | F5 E5 D5 E5 C5*4 | A4 . A4 A4 F5*4 | E5 D5 C5 D5 G4*4",
        ),
        trk("brass", 0.12, "E4*4 G4*4 | A4*4 G4*4 | F4*4 A4*4 | G4*4 B4*4"),
        trk(
          "bass",
          0.36,
          "C3 . G2 . C3 . G2 . | C3 . G2 . C3 . E3 . | F2 . C3 . F2 . A2 . | G2 . D3 . G2 . B2 .",
        ),
        trk(null, 0.5, "kt h s h k h s s | k h s h k h s c", 1),
      ]),
      alley: song(96, 0.1, [
        trk(
          "pizz",
          0.42,
          "D3 . A2 . D3 . A2 . | F3 . C3 . F3 . E3 . | D3 . A2 . Bb2 . A2 . | E3 . A2 . A2 G2 F2 E2",
        ),
        trk(
          "pizz",
          0.3,
          ". . D5 . F5 . . E5 | . . C5 . A4 . . . | . . D5 . F5 . A5 . | G#5*2 A5*2 .*4",
        ),
        trk(null, 0.35, "k . h . . . h . | k . h . . h h .", 1),
      ]),
      villain: song(80, 0, [
        trk(
          "organ",
          0.22,
          "D2*4 Ab2*4 | D2*4 Ab2*2 G2 F2 | D2*4 Ab2*4 | C#2*4 C#2*2 D2*2",
        ),
        trk(
          "brass",
          0.16,
          "D4*2 F4*2 Ab4*4 | G4*2 F4 E4 D4*4 | F4*2 Ab4*2 B4*4 | A4*2 G#4*2 A4*4",
        ),
        trk(null, 0.55, "t . . . s . . . | t . t . s . . .", 1),
      ]),
      chase: song(150, 0, [
        trk(
          "bass",
          0.4,
          "D2 D2 D3 D2 Ab2 Ab2 Ab3 Ab2 | G2 G2 G3 G2 F2 F2 E2 E2",
        ),
        trk("brass", 0.16, "D5*2 . D5 Ab5*2 G5 F5 | E5*2 F5*2 D5*4"),
        trk(null, 0.5, "k h s h k k s s", 1),
      ]),
      room: song(124, 0, [
        trk(
          "chip",
          0.1,
          "F5 A5 C6 A5 F5 A5 C6 A5 | G5 Bb5 D6 Bb5 G5 Bb5 D6 Bb5 | A5 C6 E6 C6 A5 C6 E6 C6 | Bb5 . A5 . G5 . E5 .",
        ),
        trk(
          "tri",
          0.32,
          "F2 . F3 . F2 . F3 . | G2 . G3 . G2 . G3 . | A2 . A3 . A2 . A3 . | Bb2 . Bb2 . C3 . C3 .",
        ),
        trk(null, 0.28, "k h s h k h s h", 1),
      ]),
      street: song(112, 0.08, [
        trk(
          "bass",
          0.42,
          "A2 . A2 A3 . G2 . E2 | A2 . A2 A3 . C3 . D3 | F2 . F2 F3 . E2 . D2 | E2 . E2 E3 . G#2 . B2",
        ),
        trk(
          "brass",
          0.17,
          "A4 . C5 . D5 . E5*2 | .*8 | F5 . E5 . D5 . C5*2 | B4*2 G#4*2 E4*4",
        ),
        trk(null, 0.5, "k h s h . k s o", 1),
      ]),
      shop: song(104, 0.16, [
        trk(
          "marimba",
          0.3,
          "G4 . B4 D5 . E5 D5 B4 | C5*2 A4 . F#4*2 D4*2 | G4 . B4 D5 . G5 F#5 D5 | E5*6 .*2 | C5 . E5 G5 . A5 G5 E5 | D5*2 B4 . G4*2 E4*2 | A4 . C5 B4 . A4 G4 F#4 | G4*6 .*2 | B4 . . E5 . . G5 . | F#5 . E5 . D#5*4 | E5 . . G5 . . B5 . | A5 . G5 . F#5*4 | C5 . . E5 . . G5 . | F#5 . E5 . D5*4 | A4 . B4 . C5 . D5 . | D5 .*7",
        ),
        trk(
          "bass",
          0.36,
          "G2 . B2 . D3 . B2 . | A2 . C3 . D3 . F#2 . | G2 . D3 . G2 . B2 . | C3 . E3 . G2 . E3 . | C3 . G2 . C3 . E3 . | G2 . D3 . E2 . B2 . | A2 . E3 . D3 . F#3 . | G2 . D3 . G2 . . . | E2 . B2 . E2 . B2 . | B1 . F#2 . B1 . D#2 . | E2 . B2 . E2 . G2 . | B1 . D#2 . F#2 . B1 . | C2 . G2 . C2 . E2 . | D2 . A2 . D2 . F#2 . | A2 . C3 . D3 . F#2 . | D2 . . . D2 C2 B1 A1",
        ),
        trk(null, 0.3, "k r s r k r s r", 1),
      ]),
    };
    function tick() {
      const ac = AU.ac;
      if (!ac || !AU.song) return;
      const S2 = AU.song,
        sd = 60 / S2.bpm / 2;
      if (AU.next < ac.currentTime - 0.2) AU.next = ac.currentTime + 0.05;
      while (AU.next < ac.currentTime + 0.15) {
        const stp = AU.step;
        for (const tr of S2.tracks) {
          const e = tr.ev[stp % tr.len];
          if (!e) continue;
          const t = AU.next + (stp % 2 ? S2.swing * sd : 0);
          for (const n of e) {
            if (tr.drum) {
              for (const ch of n.d) if (DR[ch]) DR[ch](t, tr.vol, AU.g);
            } else
              for (const f of n.f)
                INST[tr.inst](f, t, n.len * sd, tr.vol, AU.g);
          }
        }
        AU.next += sd;
        AU.step++;
      }
    }
    function music(id) {
      if (!AU.ac) {
        AU.pending = id;
        return;
      }
      if (AU.cur === id) return;
      const ac = AU.ac,
        t = ac.currentTime;
      if (AU.g) {
        const og = AU.g;
        og.gain.cancelScheduledValues(t);
        og.gain.setValueAtTime(og.gain.value, t);
        og.gain.linearRampToValueAtTime(0.0001, t + 0.5);
        setTimeout(() => og.disconnect(), 1200);

      I =
        pN_e((x - 234) / 30, (y - 24) / 18) +
        (y > 95 ? 0.35 * pN_e((x - 234) / 40, (y - 99) / 4) : 0);
      r += 0.05 * I;

      b += 0.6 * I;

        (y > 95 ? 0.9 * pN_e((x - 19) / 22, (y - 102) / 7) : 0);

      r += 0.12 * I;
      g += 0.2 * I;
      b += 0.32 * I;

    function hexRGB(h) {

    function cardBg(cd) {
      if (cardCache[cd.id]) return cardCache[cd.id];
      const c = mkC(320, 200),
        x = c.getContext("2d"),
        im = x.createImageData(320, 200);
      const A = hexRGB(cd.c1),
        B = hexRGB(cd.c2),
        Fr = hexRGB(cd.fr),
        cx = 80,
        cy = 112;
      /* jagged starburst radius by angle */
      const burst = (an) => {
        const n = 14,
          t = ((an + Math.PI) / (Math.PI * 2)) * n,
          f = t - Math.floor(t);
        return 46 + Math.abs(f - 0.5) * 2 * 22;
      };
      for (let y = 0; y < 200; y++)
        for (let i = 0; i < 320; i++) {
          const dx = i - cx,
            dy = y - cy,
            an = Math.atan2(dy, dx),
            d = Math.sqrt(dx * dx + dy * dy);
          const k = Math.floor((an + Math.PI) / (Math.PI / 20)) & 1;
          let q = (k ? A : B).slice();
          const lit = Math.max(0, 1 - d / 190) * 0.45;
          q = q.map((v, j) => v + (Fr[j] - v) * lit);
          /* halftone dots grow toward the edges */
          const hx_ = (i % 6) - 2.5,
            hy_ = (y % 6) - 2.5,
            hr = Math.min(2.9, d / 70);
          if (hx_ * hx_ + hy_ * hy_ < hr * hr) q = q.map((v) => v * 0.62);
          const br = burst(an);
          if (d < br) {
            q = Fr.map((v) => v + (255 - v) * 0.18);
            if (d > br - 3) q = [10, 8, 16];
            else {
              const hr2 = Math.min(2.4, d / 34);
              if (hx_ * hx_ + hy_ * hy_ < hr2 * hr2)
                q = Fr.map((v) => v * 0.92 + 255 * 0.08 * 0);
              if (d < br - 3 && d > br - 6)
                q = Fr.map((v) => v + (255 - v) * 0.6);
            }
          }
          const o = (y * 320 + i) * 4;
          im.data[o] = q[0];
          im.data[o + 1] = q[1];
          im.data[o + 2] = q[2];
          im.data[o + 3] = 255;
        }
      x.putImageData(im, 0, 0);

    function moveActor(a, dt) {
      if (!a.target) {
        a.walking = false;

      const dx = a.target.x - a.x,
        dy = a.target.y - a.y,
        d = Math.hypot(dx, dy * 1.4),
        step = (a.speed * dt) / 1000;
      if (d <= step) {
        a.x = a.target.x;
        a.y = a.target.y;
        a.target = null;
        a.walking = false;
        a.frame = 0;
        const r = a.arrive;
        a.arrive = null;
        if (r) r();
        return;
      }
      a.x += (dx / d) * step;
      a.y += (dy / d) * step;
      a.walking = true;
      if (Math.abs(dx) > 0.5) a.dir = dx > 0 ? 1 : -1;
      a.ft += dt;

        a.ft = 0;
        a.frame = (a.frame + 1) % 4;

    /* ======================= ART KIT: shared painting helpers ======================= */
    function brick(x, y, w, h, base, mortar, hi) {

        for (let xx = x + ((yy >> 2) & 1) * 4; xx < x + w; xx += 8)
          R(xx, yy, 1, 4, mortar);
      }
      if (hi) {
        const r = rng(x * 3 + y);
        for (let i = 0; i < (w * h) / 120; i++)

      }
    }
    function planks(x, y, w, h, base, line) {
      R(x, y, w, h, base);

        for (let xx = x + ((((yy / 6) | 0) * 29) % 50); xx < x + w; xx += 50)
          R(xx, yy, 1, 6, line);

    function vplanks(x, y, w, h, base, line) {

    function inkDrips(seed, x0, w, maxh) {

        const x = x0 + ((r() * w) | 0),
          h = 4 + ((r() * maxh) | 0);
        R(x, 0, 2, h, "#05040a");
        R(x, h, 2, 2, "#2a2a3a");
      }
    }
    function inkFloor(y0) {
      vgrad(0, y0, 320, 144 - y0, ["#1a1628", "#141022", "#0e0a18"]);
      for (let y = y0 + 2; y < 144; y += 8) R(0, y, 320, 1, "#221c34");
      for (let x = 0; x < 320; x += 24) R(x, y0, 1, 144 - y0, "#221c34");
    }
    function ladderUp(x, y0, y1) {
      R(x, y0, 2, y1 - y0, "#4a321e");

      for (let y = y0 + 4; y < y1; y += 7) R(x, y, 14, 2, "#6a4a2e");

    function stairsDown(x, w, col1, col2) {

    function portrait(x, y, w, h, frame, bg, hair, skin) {
      R(x, y, w, h, frame);

    /* ---- painting helpers (read-only for scene painters; add your own with your prefix) ---- */
    /* hex <-> rgb, mixing and ramps */
    function hx(c) {
      return [
        parseInt(c.slice(1, 3), 16),
        parseInt(c.slice(3, 5), 16),
        parseInt(c.slice(5, 7), 16),
      ];
    }
    function rgbHex(r, g, b) {
      return (
        "#" +
        [r, g, b]
          .map((v) =>
            Math.max(0, Math.min(255, Math.round(v)))
              .toString(16)
              .padStart(2, "0"),
          )
          .join("")
      );
    }
    function mix(a, b, t) {
      const A = hx(a),
        B = hx(b);
      return rgbHex(
        A[0] + (B[0] - A[0]) * t,
        A[1] + (B[1] - A[1]) * t,
        A[2] + (B[2] - A[2]) * t,
      );
    }
    function ramp(dark, light, n) {
      const o = [];
      for (let i = 0; i < n; i++)
        o.push(mix(dark, light, n > 1 ? i / (n - 1) : 0));
      return o;
    }
    /* dithered translucent overlay: density 0..1 (Bayer), e.g. shadows, haze, light */
    function veil(x, y, w, h, col, d) {
      if (d <= 0) return;
      dith(x | 0, y | 0, w | 0, h | 0, null, col, Math.min(1, d));
    }
    /* vertical fade overlay from density d0 (top) to d1 (bottom), in bands */
    function vveil(x, y, w, h, col, d0, d1, band) {
      band = band || 2;
      for (let j = 0; j < h; j += band) {
        const t = h > 1 ? j / (h - 1) : 0;
        veil(x, y + j, w, Math.min(band, h - j), col, d0 + (d1 - d0) * t);
      }
    }
    function hveil(x, y, w, h, col, d0, d1, band) {
      band = band || 2;
      for (let i = 0; i < w; i += band) {
        const t = w > 1 ? i / (w - 1) : 0;
        veil(x + i, y, Math.min(band, w - i), h, col, d0 + (d1 - d0) * t);
      }
    }
    /* radial light pool (or shadow) with dithered falloff */
    function glow(cx, cy, rx, ry, col, dmax, steps) {
      steps = steps || 7;
      for (let s = steps; s >= 1; s--) {
        const f = s / steps,
          d = dmax * (1 - f) * (1 - f) + dmax * 0.08;
        const w = Math.round(rx * f),
          h = Math.round(ry * f);
        for (let j = -h; j <= h; j++) {
          const k = Math.round(
            w * Math.sqrt(Math.max(0, 1 - (j * j) / (h * h || 1))),
          );
          veil(cx - k, cy + j, 2 * k + 1, 1, col, (d / steps) * 2.2);
        }
      }
    }
    /* light cone from a lamp (top point) widening down */
    function cone(x, y, topW, botW, h, col, d) {
      for (let j = 0; j < h; j++) {
        const t = j / h,
          w = topW + (botW - topW) * t;
        veil(
          Math.round(x - w / 2),
          y + j,
          Math.round(w),
          1,
          col,
          d * (1 - t * 0.65),
        );
      }
    }
    /* soft contact shadow under objects */
    function contact(cx, cy, rx, ry, col, d) {
      glow(cx, cy, rx, ry, col || "#000000", d || 0.6, 4);
    }
    /* sprinkle seeded pixels (grime, grain, sparkle) */
    function speckle(seed, x, y, w, h, cols, n, sz) {
      const r = rng(seed);
      sz = sz || 1;
      for (let i = 0; i < n; i++)
        R(
          x + ((r() * w) | 0),
          y + ((r() * h) | 0),
          sz + (r() < 0.2 ? 1 : 0),
          sz,
          cols[(r() * cols.length) | 0],

    }
    /* bevelled block: base fill + light top/left edge + dark bottom/right edge */
    function bevel(x, y, w, h, base, hi, lo) {
      R(x, y, w, h, base);
      R(x, y, w, 1, hi);
      R(x, y, 1, h, hi);
      R(x, y + h - 1, w, 1, lo);
      R(x + w - 1, y, 1, h, lo);
    }
    /* brick wall with per-brick tone variation, top-edge highlight and bottom shadow */
    function brickWall(x, y, w, h, cols, mortar, seed, bw, bh) {
      bw = bw || 8;
      bh = bh || 4;
      const r = rng(seed || 1);
      R(x, y, w, h, mortar);
      for (let yy = 0, row = 0; yy < h; yy += bh, row++) {
        const off = row & 1 ? bw / 2 : 0;
        for (let xx = -off; xx < w; xx += bw) {
          const c = cols[(r() * cols.length) | 0];
          const bx = Math.max(x, x + xx),
            ex = Math.min(x + w, x + xx + bw - 1);
          if (ex <= bx) continue;
          const hh = Math.min(bh - 1, h - yy);
          R(bx, y + yy, ex - bx, hh, c);
          R(bx, y + yy, ex - bx, 1, mix(c, "#ffffff", 0.12));
          if (hh > 2)
            R(bx, y + yy + hh - 1, ex - bx, 1, mix(c, "#000000", 0.18));
          if (r() < 0.12)
            R(
              bx + ((r() * (ex - bx)) | 0),
              y + yy + 1,
              2,
              1,
              mix(c, "#000000", 0.25),
            );
        }
      }
    }
    /* stone blocks (irregular) */
    function stoneWall(x, y, w, h, cols, mortar, seed) {
      const r = rng(seed || 2);
      R(x, y, w, h, mortar);
      for (let yy = 0; yy < h;) {
        const sh = 5 + ((r() * 4) | 0);
        for (let xx = 0; xx < w;) {
          const sw = 8 + ((r() * 10) | 0),
            c = cols[(r() * cols.length) | 0];
          const ww = Math.min(sw - 1, w - xx),
            hh = Math.min(sh - 1, h - yy);
          if (ww > 0 && hh > 0) {
            R(x + xx, y + yy, ww, hh, c);
            R(x + xx, y + yy, ww, 1, mix(c, "#ffffff", 0.15));
            R(x + xx, y + yy + hh - 1, ww, 1, mix(c, "#000000", 0.22));
            R(x + xx + ww - 1, y + yy, 1, hh, mix(c, "#000000", 0.15));
          }
          xx += sw;
        }
        yy += sh;
      }
    }
    /* wood: horizontal boards with per-board tone, grain streaks, knots and nail heads */
    function woodH(x, y, w, h, cols, line, seed, bh) {
      bh = bh || 6;
      const r = rng(seed || 3);
      for (let yy = 0; yy < h; yy += bh) {
        const c = cols[(r() * cols.length) | 0],
          hh = Math.min(bh, h - yy);
        R(x, y + yy, w, hh, c);
        R(x, y + yy, w, 1, line);
        for (let g = 0; g < w / 14; g++) {

            gl = 6 + ((r() * 24) | 0);
          R(
            gx,
            y + yy + 1 + ((r() * (hh - 1)) | 0),
            gl,
            1,
            mix(c, "#000000", 0.12),
          );
        }
        for (
          let xx = x + ((r() * 40) | 0);
          xx < x + w;
          xx += 30 + ((r() * 40) | 0)
        ) {
          R(xx, y + yy, 1, hh, line);
          if (hh > 3) {
            R(xx + 2, y + yy + 2, 1, 1, mix(c, "#000000", 0.4));
          }
        }
        if (r() < 0.4) {
          const kx = x + ((r() * w) | 0);
          R(kx, y + yy + 2, 3, 2, mix(c, "#000000", 0.25));
          R(kx + 1, y + yy + 2, 1, 1, mix(c, "#000000", 0.4));
        }
      }
    }
    /* wood: vertical boards (walls, doors) */
    function woodV(x, y, w, h, cols, line, seed, bw) {
      bw = bw || 10;
      const r = rng(seed || 4);
      for (let xx = 0; xx < w; xx += bw) {
        const c = cols[(r() * cols.length) | 0],
          ww = Math.min(bw, w - xx);
        R(x + xx, y, ww, h, c);
        R(x + xx, y, 1, h, line);
        R(x + xx + 1, y, 1, h, mix(c, "#ffffff", 0.1));
        for (let g = 0; g < h / 10; g++) {
          const gy = y + ((r() * h) | 0),
            gl = 4 + ((r() * 16) | 0);
          R(
            x + xx + 2 + ((r() * (ww - 3)) | 0),
            gy,
            1,
            gl,
            mix(c, "#000000", 0.12),
          );
        }
        if (r() < 0.35) {

    /* glass pane with sky tint and diagonal reflection streaks */
    function pane(x, y, w, h, top, bot, streak) {
      vgrad(x, y, w, h, [top, bot]);

      for (let k = 0; k < 2; k++) {
        const o = 4 + k * 7;
        for (let j = 0; j < h; j++) {

          const t = (y - y0) / (y1 - y0);

    /* ======================= Smudge's DIY costume trunk (from the Smudge trait art) ======================= */

      let h = (a * 374761393 + b * 668265263) | 0;

    /* --- comic panel painting kit (cached per variant; each tile = panel + its gutter paper) --- */
    const pL_INK = "#14101a";
    function pL_ht(x, y, w, h, col, step, f) {
      for (let yy = 0, row = 0; yy < h; yy += step, row++)
        for (let xx = row & 1 ? step >> 1 : 0; xx < w; xx += step) {
          const v = f ? f(xx / w, yy / h) : 0.5;
          if (v < 0.12) continue;
          const X = x + xx,
            Y = y + yy;
          R(X, Y, 1, 1, col);
          if (v > 0.45) {
            R(X - 1, Y, 3, 1, col);
            R(X, Y - 1, 1, 3, col);
          }
          if (v > 0.8) R(X - 1, Y - 1, 3, 3, col);
        }
    }
    function pL_ln(x0, y0, x1, y1, c, t) {
      x0 |= 0;
      y0 |= 0;
      x1 |= 0;
      y1 |= 0;
      const dx = Math.abs(x1 - x0),
        dy = -Math.abs(y1 - y0),
        sx = x0 < x1 ? 1 : -1,
        sy = y0 < y1 ? 1 : -1;
      let e = dx + dy;
      for (;;) {
        R(x0, y0, t || 1, t || 1, c);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * e;
        if (e2 >= dy) {
          e += dy;
          x0 += sx;
        }
        if (e2 <= dx) {
          e += dx;
          y0 += sy;
        }
      }
    }
    function pL_rays(cx, cy, x, y, w, h, c, n, r0, wid) {
      for (let j = 0; j < h; j++)
        for (let i = 0; i < w; i++) {
          const dx = x + i - cx,
            dy = y + j - cy,
            rr = Math.sqrt(dx * dx + dy * dy);
          if (rr < r0) continue;
          const a = (Math.atan2(dy, dx) / (Math.PI * 2) + 1) * n;
          if (a % 1 < wid * (1 - (r0 / (rr + r0)) * 0.6))
            R(x + i, y + j, 1, 1, c);
        }
    }
    function pL_burst(cx, cy, r1, r2, n, fill, line) {
      const B = Math.ceil(r2) + 2;

          const rr = Math.sqrt(i * i + j * j),
            a = (Math.atan2(j, i) / (Math.PI * 2) + 1) * n,
            t = Math.abs((a % 1) * 2 - 1),
            sp = r1 + (r2 - r1) * (1 - t);
          if (rr <= sp - 1.2) R(cx + i, cy + j, 1, 1, fill);
          else if (rr <= sp + 0.3) R(cx + i, cy + j, 1, 1, line);

        for (let k = 0; k + 1 < xs.length; k += 2) {

      let k = Math.floor(t);
      const f = t - k;
      if (f > 0.6 || (f > 0.42 && BY[(y & 3) * 4 + (x & 3)] < 8)) k++;

    /* additive coloured light baked into the cached bg (posterised + Bayer-dithered so it stays pixel-art) */
    function pF_lightFn(x0, y0, w, h, col, fn) {
      x0 = Math.max(0, x0 | 0);
      y0 = Math.max(0, y0 | 0);
      w = Math.min(G.canvas.width - x0, w | 0);
      h = Math.min(G.canvas.height - y0, h | 0);
      if (w <= 0 || h <= 0) return;
      const im = G.getImageData(x0, y0, w, h),
        d = im.data,
        c = hx(col);
      for (let j = 0; j < h; j++)
        for (let i = 0; i < w; i++) {
          const f = fn(x0 + i, y0 + j);
          if (f <= 0) continue;
          const q =
            Math.floor(f * 5 + BY[((y0 + j) & 3) * 4 + ((x0 + i) & 3)] / 16) /
            5;
          if (q <= 0) continue;
          const k = (j * w + i) * 4;
          d[k] = Math.min(255, d[k] + c[0] * q);
          d[k + 1] = Math.min(255, d[k + 1] + c[1] * q);
          d[k + 2] = Math.min(255, d[k + 2] + c[2] * q);
        }
      G.putImageData(im, x0, y0);
    }
    function pF_light(cx, cy, rx, ry, col, amt) {
      pF_lightFn(cx - rx, cy - ry, 2 * rx + 1, 2 * ry + 1, col, (x, y) => {
        const a = (x - cx) / rx,
          b = (y - cy) / ry,
          d = Math.sqrt(a * a + b * b);

    /* darken (multiply) region: shadows that keep texture */

        y0 = Math.max(0, (cy - ry) | 0),
        w = Math.min(G.canvas.width - x0, 2 * rx + 1),
        h = Math.min(G.canvas.height - y0, 2 * ry + 1);
      const im = G.getImageData(x0, y0, w, h),
        d = im.data;
      for (let j = 0; j < h; j++)
        for (let i = 0; i < w; i++) {
          const a = (x0 + i - cx) / rx,
            b = (y0 + j - cy) / ry,
            dd = Math.sqrt(a * a + b * b);
          if (dd >= 1) continue;
          const f = 1 - amt * (1 - dd);
          const k = (j * w + i) * 4;
          d[k] *= f;
          d[k + 1] *= f;
          d[k + 2] *= f;

      G.putImageData(im, x0, y0);
    }

    /* ---------- present additions: landing + Smudge's attic ---------- */
    /* pL_light: multiply the cached bg by a light field (ambient + soft point lights), quantized with Bayer dithering */
    function pL_light(x0, y0, w, h, amb, lights, lv) {
      lv = lv || 10;
      const img = G.getImageData(x0, y0, w, h),
        d = img.data;
      for (let j = 0; j < h; j++) {
        const y = y0 + j;
        for (let i = 0; i < w; i++) {
          const x = x0 + i;
          let r = amb[0],
            g = amb[1],
            b = amb[2];
          for (const L of lights) {
            let f;
            if (L.fn) f = L.fn(x, y);
            else {
              const dx = (x - L.x) / L.rx,
                dy = (y - L.y) / L.ry,
                q = 1 - Math.sqrt(dx * dx + dy * dy);
              f = q > 0 ? q * q * (3 - 2 * q) : 0;
            }
            if (f > 0) {
              r += L.c[0] * f;
              g += L.c[1] * f;
              b += L.c[2] * f;
            }
          }
          const th = (BY[(y & 3) * 4 + (x & 3)] + 0.5) / 16,
            k = (j * w + i) * 4;
          const qz = (v) => {
            const l = v * lv,
              f = Math.floor(l);
            return (f + (l - f > th ? 1 : 0)) / lv;
          };
          d[k] = Math.min(255, d[k] * qz(r));
          d[k + 1] = Math.min(255, d[k + 1] * qz(g));
          d[k + 2] = Math.min(255, d[k + 2] * qz(b));
        }
      }
      G.putImageData(img, x0, y0);
    }

    /* ======================= scrolling streets with parallax ======================= */
    /* far layer scrolls at f, mid (the room) at 1, fore at >1. Width of a layer = 320 + (roomW-320)*f */
    function layerW(rw, f) {

    /* ---------- pX_ painting helpers (set X: present street) ---------- */
    /* per-pixel light/shade, quantised to lv steps with Bayer dithering (cached bgs only; skips transparent pixels).
   fn(x,y) returns strength 0..1; mode 'add' (light) or 'mix' (tint/shade toward col) */
    function pX_fx(x0, y0, w, h, col, mode, lv, fn) {
      lv = lv || 5;
      const C = hx(col);
      x0 = Math.max(0, x0 | 0);
      y0 = Math.max(0, y0 | 0);
      w = Math.min(G.canvas.width - x0, w | 0);
      h = Math.min(G.canvas.height - y0, h | 0);
      if (w <= 0 || h <= 0) return;
      const im = G.getImageData(x0, y0, w, h),
        d = im.data;
      for (let j = 0; j < h; j++)
        for (let i = 0; i < w; i++) {
          const o = (j * w + i) * 4;
          if (d[o + 3] === 0) continue;
          const f = fn(x0 + i, y0 + j);
          if (f <= 0) continue;
          const q = Math.min(
            1,
            Math.floor(
              f * lv + (BY[((y0 + j) & 3) * 4 + ((x0 + i) & 3)] + 0.5) / 16,
            ) / lv,
          );
          if (q <= 0) continue;
          for (let k = 0; k < 3; k++)
            d[o + k] =
              mode === "add"
                ? Math.min(255, d[o + k] + C[k] * q)
                : d[o + k] + (C[k] - d[o + k]) * q;
        }
      G.putImageData(im, x0, y0);
    }
    function pX_glowL(cx, cy, rx, ry, col, amt, mode, p) {
      p = p || 1;
      pX_fx(
        cx - rx,
        cy - ry,
        rx * 2 + 1,
        ry * 2 + 1,
        col,
        mode || "add",
        12,
        (x, y) => {
          const dx = (x - cx) / rx,
            dy = (y - cy) / ry,
            e = Math.sqrt(dx * dx + dy * dy);
          return e >= 1 ? 0 : amt * Math.pow(1 - e, p);
        },
      );
    }
    function pX_vgL(x, y, w, h, col, a0, a1, mode) {
      pX_fx(
        x,
        y,
        w,
        h,
        col,
        mode || "mix",
        10,
        (xx, yy) => a0 + (a1 - a0) * ((yy - y) / Math.max(1, h - 1)),
      );
    }
    function pX_hgL(x, y, w, h, col, a0, a1, mode) {
      pX_fx(
        x,
        y,
        w,
        h,
        col,
        mode || "mix",
        10,
        (xx, yy) => a0 + (a1 - a0) * ((xx - x) / Math.max(1, w - 1)),
      );
    }
    function pX_coneL(x, y, tw, bw, h, col, amt, mode) {
      pX_fx(x - bw / 2, y, bw + 1, h, col, mode || "add", 10, (xx, yy) => {
        const t = (yy - y) / h,
          hw = (tw + (bw - tw) * t) / 2,
          e = Math.abs(xx - x) / hw;
        return e >= 1 ? 0 : amt * (1 - e * e) * (1 - t * 0.6);
      });
    }

    function pX_contact(cx, cy, rx, ry, col, d) {

    function pX_cloud(x, y, w, h, body, rim, d) {
      for (let j = 0; j < h; j++) {
        const t = Math.abs(j - h / 2) / (h / 2);
        const ww = Math.round(w * Math.sqrt(1 - t * t));
        veil(
          x + (w - ww) / 2 + ((j * 7) % 5),
          y + j,
          ww,
          1,
          body,
          d * (1 - t * 0.5),
        );

    /* vertical wet-road reflection streak under a light */
    function pX_refl(seed, x, w, y0, y1, col, d) {
      const cx = x + w / 2,
        hw = w / 2 + 1;
      pX_fx(x - 1, y0, w + 3, y1 - y0, col, "mix", 5, (xx, yy) => {
        const e = Math.abs(xx - cx) / hw;
        if (e >= 1) return 0;
        const t = (yy - y0) / (y1 - y0);
        const n =
          (Math.imul(
            yy * 131 + ((xx / 3) | 0) * 17 + seed * 977,
            2654435761,
          ) >>>
            24) /
          255;
        return (
          d * (1 - e * e) * (1 - t * 0.45) * (n < 0.25 ? 0.2 : 0.6 + n * 0.5)
        );
      });
    }

            : "The boiler's water hatch has been rusted shut for years. It would take a man of colossal strength. Or a very determined... anything.";

              : "There's a rain barrel in the yard. Fill your bucket."
            : "The boiler needs water. Bessie the horse has the only bucket in the yard. She's very possessive. Except about snacks.";
        if (!a.fuel)
          return a.review
            ? "Burn the almanacs. All of them. They're in the attic."
            : "Fuel? The coal is soaked and so is the firewood. And no, you may NOT burn my almanacs. They are my life's work.";
        return has("candle")
          ? "Light the fuel in the firebox with that candle."
          : "Fire? There's a candle on my desk.";
      }
      if (!a.sent["combo>willis"])
        return "I set my new safe's combination today. Seven, one, four. I wrote it on a card. I should not have said that out loud. Your friend in the future might find it useful, though.";
      if (!a.jarHidden)
        return "My Ink-B-Gone is guaranteed for four hundred years. Someone in the future really ought to test that.";

    }

      for (let k = 0; k < 2; k++) {
        const f = (NOW / 1400 + k * 0.5) % 1,
          rx = Math.round(10 + f * 18),
          ry = Math.max(1, Math.round(1 + f * 3));
        if (f < 0.85)
          for (let i = 0; i < 24; i++) {
            const an = (i / 24) * 6.283;
            if (Math.sin(an) < 0) continue;
            R(
              AX + Math.round(Math.cos(an) * rx),
              AY - 1 + Math.round(Math.sin(an) * ry),
              1,
              1,
              f < 0.5 ? P.h : P.m,
            );
          }
      }
      /* body: rim light up-left, deep shade down-right, ink core */
      const body = (ox, oy, c) => {
        ell(AX + ox, AY - 11 + oy, 19 + w, 11, c);
        ell(AX - 3 + ox, AY - 22 + oy, 14 - w, 11, c);
        ell(AX + 4 + ox, AY - 29 + oy, 9, 8, c);
        ell(AX - 12 + ox, AY - 6 + oy, 6, 5, c);
        ell(AX + 13 + ox, AY - 5 + oy, 6, 5, c);
      };
      body(-1, -1, P.m);
      body(1, 1, P.d);
      body(0, 0, P.k);
      /* glossy highlights */ for (let i = 0; i < 7; i++)
        R(
          AX - 15 + i,
          AY -
            27 -
            Math.round(Math.sin((i / 6) * Math.PI) * 3) +
            (i < 2 ? 2 : 0),
          1,
          1,
          P.h,
        );
      R(AX - 14, AY - 25, 1, 3, P.h);
      R(AX - 12, AY - 29, 2, 1, P.s);
      R(AX + 12, AY - 14, 1, 4, P.m);
      R(AX + 11, AY - 17, 1, 2, P.m);
      R(AX - 16, AY - 14, 1, 5, P.h);
      R(AX - 15, AY - 16, 1, 2, P.h);
      R(AX - 16, AY - 14, 1, 1, P.s);
      R(AX + 1, AY - 35, 4, 1, P.h);
      R(AX + 2, AY - 35, 1, 1, P.s);
      R(AX + 10, AY - 20, 1, 3, P.m);
      /* drips sliding into the puddle */ for (let i = 0; i < 6; i++) {
        const x = AX - 17 + i * 7,
          d = (NOW / 700 + i * 0.37) % 1,
          L = 1 + Math.floor(d * 5);
        R(x, AY - 5, 2, L, P.k);
        R(x, AY - 5 + L, 2, 1, P.k);
        R(x, AY - 5 + Math.max(0, L - 2), 1, 1, P.m);
        if (d > 0.85) R(x, AY - 1, 2, 1, P.m);
      }
      /* a bubble that swells and pops */ {
        const f = (NOW / 1700) % 1,
          bx = AX - 4 + (((NOW / 1700) | 0) % 3) * 5,
          by = AY - 37 + (((NOW / 1700) | 0) % 3 === 1 ? 3 : 0);
        if (f < 0.8) {

          else {

            R(bx - r, by - r, 1, 1, P.h);

        } else {

          R(bx + 3, by - 5, 1, 1, P.h);
          R(bx, by - 7, 1, 1, P.m);

      }
      /* hungry red eyes */ const e = a.dir > 0 ? 2 : -2,
        ex1 = AX - 8 + e,
        ey1 = AY - 29,
        ex2 = AX + 2 + e,
        ey2 = AY - 30;
      if (NOW % 3000 > 140) {
        for (const [ex, ey] of [

          R(ex - 1, ey, 7, 5, "#3a0610");
          R(ex, ey - 1, 5, 7, "#3a0610");

        R(ex2 + 1, ey2 - 2, 3, 1, P.h);
        R(ex2 + 4, ey2 - 3, 3, 1, P.h);
      } else {
        R(ex1, ey1 + 2, 5, 1, "#ff2a2a");
        R(ex2, ey2 + 2, 5, 1, "#ff2a2a");
      }
      /* mouth: jagged grin, chomps when talking */ const op =
        a.talking && ((NOW / 110) | 0) % 2;
      if (op) {

        R(AX - 7, AY - 19, 13, 5, "#6a0a18");
        R(AX - 4, AY - 16, 6, 2, "#a82a3a");

    /* a guided, forking bolt from (xa,ya) to (xb,yb); fat core + halo when full */
    function cuBoltG(seed, xa, ya, xb, yb, full, brN) {
      const r = rng(seed * 131 + 7),
        segs = [];
      let x = xa,
        y = ya;
      const n = Math.max(4, Math.round((yb - ya) / 5));
      for (let i = 1; i <= n; i++) {
        const t = i / n,
          nx = xa + (xb - xa) * t + (i < n ? r() * 10 - 5 : 0),
          ny = ya + (yb - ya) * t;
        segs.push([x, y, nx, ny, 0]);
        if (r() < (brN || 0.3) && i < n - 1) {
          let bx = nx,
            by = ny;
          const dir = r() < 0.5 ? -1 : 1;
          for (let k = 0; k < 3 + ((r() * 4) | 0); k++) {
            const qx = bx + dir * (2 + r() * 6),
              qy = by + 2 + ((r() * 5) | 0);
            segs.push([bx, by, qx, qy, 1]);
            bx = qx;
            by = qy;
          }
        }
        x = nx;
        y = ny;
      }
      if (full)
        for (const [a, b, c, d, br] of segs)
          if (!br) {
            for (const o of [-3, 3]) cuLn(a + o, b, c + o, d, "#5a6ad0");
          }
      for (const [a, b, c, d, br] of segs) {
        cuLn(a - 1, b, c - 1, d, "#9ab4ff");
        cuLn(a + 1, b, c + 1, d, "#9ab4ff");
        if (!br && full) {
          cuLn(a - 2, b, c - 2, d, "#c8d8ff");
          cuLn(a + 2, b, c + 2, d, "#c8d8ff");
        }
      }
      for (const [a, b, c, d, br] of segs) {
        cuLn(a, b, c, d, "#ffffff");
        if (!br && full) {
          cuLn(a + 1, b, c + 1, d, "#ffffff");
          cuLn(a - 1, b, c - 1, d, "#ffffff");
        }
      }
    }

    let h2_ax = 0,

        "pick",
        "use",
        "open",
        "close",
        "push",
        "pull",
        "talk",
      ];
      cut.skip = true;
      for (const [rid, act, pls] of plan) {
        st.act = act;
        st.a2 = st.a2 || { sent: {} };
        st.a3 = st.a3 || {};
        st.a4 = st.a4 || {};
        for (const pid of pls) {
          PL = ACT[pid];
          st.inv = PL.inv;
          PL.room = rid;
          try {
            go(rid, true);
          } catch (e) {}
          const objs = [
            ...hotList(),
            ...actorsHere().filter((a) => a !== PL && a.on),
          ];
          for (const o of objs)
            for (const v of verbs) {
              try {
                st.mode = "play";
                await Promise.race([
                  runVerb(v, o),
                  new Promise((r) => setTimeout(r, 60)),
                ]);
                if (st.mode === "dialog" && st.dlg) {
                  const rows = optRows();
                  for (const row of rows) {
                    try {
                      await Promise.race([
                        (async () => {
                          if (!row.silent) await say(PL, row.t);
                          if (row.f) await row.f();
                        })(),
                        new Promise((r) => setTimeout(r, 60)),
                      ]);
                    } catch (e) {}
                  }
                  st.mode = "play";
                  st.dlg = null;
                }
              } catch (e) {}
            }
          for (const id of Object.keys(INV))
            for (const v of ["look", "open", "use", "talk"]) {
              try {
                await Promise.race([
                  runVerb(v, INV[id]),
                  new Promise((r) => setTimeout(r, 40)),
                ]);
              } catch (e) {}
            }
        }
      }
      cut.skip = false;
      const have = window.DOTS_VO || {};
      const miss = {};
      for (const e of window.__sayLog) {
        const k = e.split("|")[0];
        if (!have[k]) miss[e] = 1;
      }
      return Object.keys(miss);
    };
  })();
</script>
