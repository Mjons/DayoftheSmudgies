<title>Smudge Boss Blitz</title>
<style>
:root{
  color-scheme: dark;
  --room:#0e0c0a;
  --glow:#2b2210;
  --plastic-hi:#46403a;
  --plastic:#2e2a26;
  --plastic-lo:#181614;
  --ink:#ece3cf;
  --dim:#8f8672;
  --sponge:#F9C51F;
  --goo:#F26B1D;
  --led:#ff3b30;
}
html,body{height:100%}
body{
  margin:0;
  background:var(--room);
  background-image:radial-gradient(ellipse 70% 55% at 50% 38%, var(--glow) 0%, var(--room) 70%);
  color:var(--ink);
  font-family:"Press Start 2P", ui-monospace, "Courier New", monospace;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; min-height:100%; box-sizing:border-box;
  padding-inline:16px; padding-block:16px;
  -webkit-user-select:none; user-select:none;
}
.tv{
  width:min(100%, 900px);
  display:flex; gap:20px; box-sizing:border-box;
  padding:22px; border-radius:28px;
  background:linear-gradient(180deg,var(--plastic-hi),var(--plastic) 30%,var(--plastic-lo));
  box-shadow:inset 0 2px 0 #5d554c, inset 0 -4px 0 #0b0a09, 0 40px 80px rgba(0,0,0,.65), 0 0 120px rgba(249,197,31,.07);
}
.bezel{
  flex:1; min-width:0; background:#070606; border-radius:24px; padding:16px;
  box-shadow:inset 0 0 0 3px #0e0c0c, inset 0 10px 24px #000, 0 1px 0 #4a4244;
}
.screen{
  position:relative; max-width:100%; padding:3.2% 4%;
  border-radius:22px / 18px; overflow:hidden; background:#000;
}
.screen canvas{
  display:block; width:100%; height:auto; aspect-ratio:256/224;
  image-rendering:pixelated; image-rendering:crisp-edges;
  animation:crtOn .9s ease-out both; transform-origin:50% 50%;
}
.screen::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.26) 2px 3px),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(0,0,0,.6) 100%);
}
.screen::before{
  content:""; position:absolute; inset:0; pointer-events:none; z-index:1;
  background:linear-gradient(155deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,0) 32%);
}
@keyframes crtOn{
  0%{transform:scale(1,.004); filter:brightness(6)}
  35%{transform:scale(1,.004); filter:brightness(6)}
  65%{transform:scale(1,1); filter:brightness(2)}
  100%{transform:scale(1,1); filter:brightness(1)}
}
@media (prefers-reduced-motion: reduce){ .screen canvas{animation:none} }
.side{ width:112px; flex:none; display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:6px }
.badge{font-size:7px; letter-spacing:.1em; color:#d8cdb4; background:#1a1715; padding:6px 7px; border-radius:4px; box-shadow:inset 0 1px 0 #000, 0 1px 0 #4a4244; white-space:nowrap}
.knob{ width:62px; height:62px; border-radius:50%; background:radial-gradient(circle at 38% 32%, #6f675e, #2a2622 62%, #151311); box-shadow:0 4px 8px rgba(0,0,0,.6), inset 0 -3px 5px rgba(0,0,0,.5); position:relative }
.knob::after{content:""; position:absolute; left:50%; top:7px; width:4px; height:18px; margin-left:-2px; border-radius:2px; background:#d8cdb4; transform-origin:50% 24px; transform:rotate(-25deg)}
.knob.k2{width:46px; height:46px}
.knob.k2::after{height:12px; top:5px; transform:rotate(70deg); transform-origin:50% 18px}
.grille{width:78px; height:96px; border-radius:8px; background:repeating-linear-gradient(to bottom,#0c0a09 0 4px,#36302a 4px 7px); box-shadow:inset 0 2px 4px #000}
.led{width:9px; height:9px; border-radius:50%; background:var(--led); box-shadow:0 0 10px var(--led), 0 0 2px #fff inset}
.help{
  margin:0; max-width:900px; display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
  gap:10px 20px; font-size:10px; line-height:1.8; color:var(--dim); letter-spacing:.04em;
}
.help b{color:var(--ink); font-weight:400}
.help .hi{color:var(--sponge)}
#mute{
  font:inherit; font-size:9px; color:var(--ink); background:#211d1a; border:0;
  padding:8px 10px; border-radius:6px; box-shadow:inset 0 -2px 0 #0a0908, 0 0 0 1px #3d3631; cursor:pointer;
}
#mute:focus-visible, .pad button:focus-visible{outline:2px solid var(--sponge); outline-offset:2px}
.pad{display:none; width:min(100%,560px); justify-content:space-between; align-items:center; gap:10px; touch-action:none}
.pad button{ -webkit-tap-highlight-color:transparent; touch-action:none; font:inherit; color:var(--ink); border:0; cursor:pointer }
.dpad{display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,48px); gap:2px}
.dpad button{background:#2d2825; box-shadow:inset 0 -3px 0 #120f0e, 0 3px 8px rgba(0,0,0,.5); border-radius:8px; display:grid; place-items:center}
.dpad svg{width:18px; height:18px; fill:var(--ink)}
.dpad .u{grid-column:2; grid-row:1} .dpad .l{grid-column:1; grid-row:2} .dpad .r{grid-column:3; grid-row:2} .dpad .d{grid-column:2; grid-row:3}
.mid{display:flex; flex-direction:column; gap:10px; align-items:center}
.mid button{font-size:8px; background:#3d3631; padding:9px 12px; border-radius:20px; box-shadow:inset 0 -2px 0 #120f0e}
.ab{display:flex; gap:12px; align-items:flex-end}
.ab button{width:64px; height:64px; border-radius:50%; background:#d9661f; color:#fff3e0; font-size:14px; box-shadow:inset 0 -5px 0 #7a300b, 0 4px 10px rgba(0,0,0,.5)}
.ab .a{margin-bottom:22px}
.pad button.on{filter:brightness(1.35); transform:translateY(2px)}
@media (max-width:680px){
  .side{display:none}
  .tv{padding:10px; border-radius:16px}
  .bezel{padding:7px; border-radius:14px}
  .screen{border-radius:12px / 10px}
}
@media (pointer:coarse){ .pad{display:flex} .help .keys{display:none} }
</style>

<div class="tv">
  <div class="bezel">
    <div class="screen" id="screen">
      <canvas id="game" width="256" height="224" aria-label="Smudge Boss Blitz game screen"></canvas>
    </div>
  </div>
  <div class="side" aria-hidden="true">
    <div class="badge">SPONGE-O-VISION</div>
    <div class="knob"></div>
    <div class="knob k2"></div>
    <div class="grille"></div>
    <div class="led"></div>
  </div>
</div>

<div class="pad" id="pad">
  <div class="dpad">
    <button class="u" data-act="up" aria-label="Up"><svg viewBox="0 0 10 10"><polygon points="1,7 9,7 5,2"/></svg></button>
    <button class="l" data-act="left" aria-label="Left"><svg viewBox="0 0 10 10"><polygon points="7,1 7,9 2,5"/></svg></button>
    <button class="r" data-act="right" aria-label="Right"><svg viewBox="0 0 10 10"><polygon points="3,1 3,9 8,5"/></svg></button>
    <button class="d" data-act="down" aria-label="Down"><svg viewBox="0 0 10 10"><polygon points="1,3 9,3 5,8"/></svg></button>
  </div>
  <div class="mid">
    <button data-act="next">WEAPON</button>
    <button data-act="start">MENU</button>
  </div>
  <div class="ab">
    <button class="b" data-act="fire" aria-label="Shoot">B</button>
    <button class="a" data-act="jump" aria-label="Jump">A</button>
  </div>
</div>

<p class="help">
  <span class="keys"><b>ARROWS</b> MOVE</span>
  <span class="keys"><b>Z</b> JUMP</span>
  <span class="keys"><b>X</b> SHOOT <span class="hi">HOLD TO CHARGE</span></span>
  <span class="keys"><b>Q E</b> SWAP WEAPON</span>
  <span class="keys"><b>ENTER</b> MENU</span>
  <span class="keys"><b>T</b> SUDS TANK</span>
  <span class="keys"><b>DOWN</b> GUARD</span>
  <button id="mute" type="button">SOUND ON</button>
</p>

<script>
(() => {
'use strict';
const W = 256, H = 224, FLOOR = 200, WALL_L = 16, WALL_R = 240;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const K = '#120a06';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const overlap = (a, b, s = 0) => a.x + s < b.x + b.w && a.x + a.w - s > b.x && a.y + s < b.y + b.h && a.y + a.h - s > b.y;

/* ------------------------------------------------------------------ FONT */
const FONT = {
A:'01110 10001 10001 11111 10001 10001 10001', B:'11110 10001 10001 11110 10001 10001 11110',
C:'01110 10001 10000 10000 10000 10001 01110', D:'11110 10001 10001 10001 10001 10001 11110',
E:'11111 10000 10000 11110 10000 10000 11111', F:'11111 10000 10000 11110 10000 10000 10000',
G:'01110 10001 10000 10111 10001 10001 01111', H:'10001 10001 10001 11111 10001 10001 10001',
I:'01110 00100 00100 00100 00100 00100 01110', J:'00111 00010 00010 00010 00010 10010 01100',
K:'10001 10010 10100 11000 10100 10010 10001', L:'10000 10000 10000 10000 10000 10000 11111',
M:'10001 11011 10101 10101 10001 10001 10001', N:'10001 11001 10101 10011 10001 10001 10001',
O:'01110 10001 10001 10001 10001 10001 01110', P:'11110 10001 10001 11110 10000 10000 10000',
Q:'01110 10001 10001 10001 10101 10010 01101', R:'11110 10001 10001 11110 10100 10010 10001',
S:'01111 10000 10000 01110 00001 00001 11110', T:'11111 00100 00100 00100 00100 00100 00100',
U:'10001 10001 10001 10001 10001 10001 01110', V:'10001 10001 10001 10001 10001 01010 00100',
W:'10001 10001 10001 10101 10101 10101 01010', X:'10001 10001 01010 00100 01010 10001 10001',
Y:'10001 10001 01010 00100 00100 00100 00100', Z:'11111 00001 00010 00100 01000 10000 11111',
0:'01110 10011 10101 10101 10101 11001 01110', 1:'00100 01100 00100 00100 00100 00100 01110',
2:'01110 10001 00001 00010 00100 01000 11111', 3:'11111 00010 00100 00010 00001 10001 01110',
4:'00010 00110 01010 10010 11111 00010 00010', 5:'11111 10000 11110 00001 00001 10001 01110',
6:'00110 01000 10000 11110 10001 10001 01110', 7:'11111 00001 00010 00100 01000 01000 01000',
8:'01110 10001 10001 01110 10001 10001 01110', 9:'01110 10001 10001 01111 00001 00010 01100',
'!':'00100 00100 00100 00100 00100 00000 00100', "'":'00100 00100 01000 00000 00000 00000 00000',
'-':'00000 00000 00000 11111 00000 00000 00000', '.':'00000 00000 00000 00000 00000 01100 01100',
':':'00000 01100 01100 00000 01100 01100 00000', '?':'01110 10001 00001 00010 00100 00000 00100',
'/':'00001 00010 00010 00100 01000 01000 10000', '+':'00000 00100 00100 11111 00100 00100 00000',
'(':'00010 00100 01000 01000 01000 00100 00010', ')':'01000 00100 00010 00010 00010 00100 01000',
'>':'01000 00100 00010 00001 00010 00100 01000', '<':'00010 00100 01000 10000 01000 00100 00010',
'x':'00000 00000 10001 01010 00100 01010 10001',
'#':'01010 01010 11111 01010 11111 01010 01010'
};
const glyphCache = new Map();
function glyph(ch, color) {
  const key = ch + color; let g = glyphCache.get(key); if (g) return g;
  g = document.createElement('canvas'); g.width = 5; g.height = 7;
  const x = g.getContext('2d'); x.fillStyle = color;
  const rows = FONT[ch];
  if (rows) rows.split(' ').forEach((r, j) => { for (let i = 0; i < 5; i++) if (r[i] === '1') x.fillRect(i, j, 1, 1); });
  glyphCache.set(key, g); return g;
}
function text(s, x, y, color = '#fff', sc = 1, shadow = '#000') {
  s = String(s); x = Math.round(x); y = Math.round(y);
  for (let i = 0; i < s.length; i++) {
    let ch = s[i]; if (ch === ' ') continue; if (ch !== 'x') ch = ch.toUpperCase();
    if (shadow) ctx.drawImage(glyph(ch, shadow), x + i * 6 * sc + sc, y + sc, 5 * sc, 7 * sc);
    ctx.drawImage(glyph(ch, color), x + i * 6 * sc, y, 5 * sc, 7 * sc);
  }
}
const tw = (s, sc = 1) => String(s).length * 6 * sc - sc;
const ctext = (s, y, color, sc = 1, shadow = '#000') => text(s, (W - tw(s, sc)) / 2, y, color, sc, shadow);

/* ------------------------------------------------------------ SPRITE KIT */
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function outline(c, col = K) {
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const d = g.getImageData(0, 0, w, h), a = d.data, add = [];
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && a[(y * w + x) * 4 + 3] > 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++)
    if (!op(x, y) && (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1))) add.push(x, y);
  g.fillStyle = col; for (let i = 0; i < add.length; i += 2) g.fillRect(add[i], add[i + 1], 1, 1);
}
function paint(w, h, fn, ol = true) {
  const c = cv(w, h), g = c.getContext('2d');
  const api = {
    px(x, y, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), 1, 1); },
    rect(x, y, ww, hh, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(ww), Math.round(hh)); },
    ell(cx, cy, rx, ry, col) {
      g.fillStyle = col;
      for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx); x++) {
        const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry; if (dx * dx + dy * dy <= 1) g.fillRect(x, y, 1, 1);
      }
    },
    clear(x, y, ww = 1, hh = 1) { g.clearRect(x, y, ww, hh); }, g
  };
  fn(api); if (ol) outline(c); return c;
}
function flip(c) { const f = cv(c.width, c.height), x = f.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0); return f; }

/* --------------------------------------------------------------- WEAPONS */
const WEAPONS = [
  { key:'goo',   name:'GOO BUSTER',   short:'GOO', col:'#F26B1D', cost:0, desc:'HOLD FIRE TO CHARGE' },
  { key:'slick', name:'SCUM SLICK',   short:'SLK', col:'#A68CFF', cost:1, desc:'GOO SKATES ALONG THE FLOOR' },
  { key:'bolt',  name:'RUST BOLT',    short:'BLT', col:'#C0763E', cost:2, desc:'LOBBED BOMB. BIG BOOM' },
  { key:'flare', name:'FLARE FAN',    short:'FLR', col:'#FF3B30', cost:2, desc:'THREE-WAY FIRE SPREAD' },
  { key:'spore', name:'SPORE SEEKER', short:'SPR', col:'#5BC44E', cost:2, desc:'HOMING SPORES FIND THE BOSS' },
  { key:'wool',  name:'WOOL SPIN',    short:'WOL', col:'#C3CCD6', cost:4, desc:'ORBIT SHIELD. FIRE AGAIN TO THROW' },
  { key:'plate', name:'PLATE RANG',   short:'PLT', col:'#3D8BFF', cost:2, desc:'BOOMERANG THAT CUTS THROUGH' },
  { key:'ink',   name:'INK BLOT',     short:'INK', col:'#4A3FE0', cost:2, desc:'LOBBED INK LEAVES A HURTING PUDDLE' },
];
const HAND_COLS = [...WEAPONS.map(w => w.col), '#FFFFFF'];

/* ---------------------------------------------------------------- SMUDGE */
const SM = { Y:'#F9C51F', Y2:'#DFA10E', Y3:'#CC8C08', HL:'#FFE680' };
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  r = clamp(Math.round(r * k), 0, 255); g = clamp(Math.round(g * k), 0, 255); b = clamp(Math.round(b * k), 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function paintSmudge(legs, arms, hurt, hc) {
  const hl = shade(hc, 1.35), dk = shade(hc, .75);
  return paint(28, 28, a => {
    const bob = legs === 'run2' ? 1 : 0, cy = 10 + bob;
    const L = { stand:[[9,18,6],[14,18,6]], run1:[[6,18,5],[17,18,5]], run2:[[10,19,5],[13,19,5]], jump:[[8,17,3],[15,17,3]] }[legs];
    L.forEach(([x, y, h]) => { a.rect(x, y, 2, h, SM.Y); a.rect(x, y + h - 2, 2, 2, hc); });
    L.forEach(([x, y, h]) => { a.ell(x + 1, y + h + .6, 2.7, 1.5, hc); a.px(x, y + h, hl); a.px(x + 3, y + h + 1, dk); });
    const hand = (x, y, drip) => { a.ell(x, y, 2.3, 2.3, hc); a.px(x - 1, y - 1, hl); if (drip) { a.rect(x - 1, y + 2, 1, drip, hc); a.px(x + 1, y + 2, dk); } };
    const armStyle = arms === 'shoot' ? (legs === 'jump' ? 'up' : legs.startsWith('run') ? 'swing' : 'down') : arms;
    if (armStyle === 'down') { a.rect(3, 11, 2, 5, SM.Y); hand(4, 17, 3); }
    if (armStyle === 'swing') { a.rect(4, 11, 2, 4, SM.Y); hand(5, 15.5, 2); }
    if (armStyle === 'up') { a.rect(3, 4, 2, 7, SM.Y); hand(3.8, 3.6, 0); }
    if (arms === 'shoot') { a.rect(20, 9, 3, 2, SM.Y); hand(24, 10, 2); }
    else if (armStyle === 'down') { a.rect(20, 11, 2, 5, SM.Y); hand(21, 17, 3); }
    else if (armStyle === 'swing') { a.rect(19, 12, 2, 4, SM.Y); hand(20, 16.5, 2); }
    else { a.rect(20, 4, 2, 7, SM.Y); hand(21, 3.6, 0); }
    // body: lumpy sponge
    a.ell(12, cy, 8.6, 8.6, SM.Y2);
    a.ell(11.3, cy - .7, 7.9, 7.9, SM.Y);
    a.ell(8, cy - 8, 2.3, 1.5, SM.Y); a.ell(15.5, cy - 8.2, 2.3, 1.5, SM.Y);
    a.ell(8.5, cy - 4.5, 1.8, 1.1, SM.HL);
    [[5, cy - 1], [16, cy - 5], [17, cy + 2], [7, cy + 4], [13, cy + 6], [10, cy - 7], [18, cy - 1]].forEach(([x, y]) => a.rect(x, y, 2, 1, SM.Y3));
    if (!hurt) {
      a.rect(11, cy - 2, 1, 2, K); a.rect(15, cy - 2, 1, 2, K);
      a.rect(10, cy - 4, 2, 1, K); a.px(14, cy - 4, K); a.rect(15, cy - 5, 2, 1, K);
      [[11, 3], [12, 4], [13, 4], [14, 4], [15, 3], [16, 2]].forEach(([x, y]) => a.px(x, cy + y, K));
    } else {
      [[10, -3], [12, -3], [11, -2], [10, -1], [12, -1], [14, -3], [16, -3], [15, -2], [14, -1], [16, -1]].forEach(([x, y]) => a.px(x, cy + y, K));
      a.rect(12, cy + 2, 3, 3, K); a.px(13, cy + 3, '#7a1d0a');
    }
  });
}
function paintSlide(hc) {
  const hl = shade(hc, 1.35);
  return paint(28, 28, a => {
    a.ell(4, 24.6, 2.8, 1.5, hc); a.ell(24, 24.6, 2.9, 1.5, hc); a.px(23, 24, hl);
    a.ell(2.5, 21, 2.2, 2, hc); a.ell(25, 20, 2.3, 2.2, hc); a.px(24, 19, hl);
    a.ell(13.5, 20, 10.6, 5.8, SM.Y2); a.ell(12.8, 19.4, 9.9, 5.2, SM.Y);
    a.ell(9, 17, 2, 1, SM.HL); [[6, 20], [18, 17], [20, 21], [11, 23], [15, 22]].forEach(([x, y]) => a.rect(x, y, 2, 1, SM.Y3));
    a.rect(15, 17, 1, 2, K); a.rect(19, 17, 1, 2, K); a.rect(14, 16, 2, 1, K); a.rect(19, 15, 2, 1, K);
    [[15, 21], [16, 22], [17, 22], [18, 22], [19, 21]].forEach(([x, y]) => a.px(x, y, K));
  });
}
const POSES = { stand:['stand','down'], run1:['run1','swing'], run2:['run2','swing'], jump:['jump','up'] };
const SMUDGE = HAND_COLS.map(hc => {
  const o = {};
  for (const k in POSES) {
    const [legs, arms] = POSES[k];
    const n = paintSmudge(legs, arms, false, hc), s = paintSmudge(legs, 'shoot', false, hc);
    o[k] = [n, flip(n)]; o[k + 'S'] = [s, flip(s)];
  }
  const h = paintSmudge('jump', 'up', true, hc); o.hurt = [h, flip(h)];
  const sl = paintSlide(hc); o.slide = [sl, flip(sl)];
  return o;

/* tile physics */
const tAt = (c, r) => { const S = G.S; if (c < 0 || c >= S.LW) return 'W'; if (r < 0 || r >= LROWS) return '.'; return S.T[r][c]; };
const solidT = ch => ch === '#' || ch === 'W' || ch === 'X' || ch === 'S' || ch === 'V';
const oneWayT = ch => ch === '=' || (ch === 'i' && !!save.traits.shades);
function tileMove(e) {
  e.x += e.vx; e.hitWall = 0;
  const r0 = Math.floor(e.y / TS), r1 = Math.floor((e.y + e.h - 1) / TS);
  if (e.vx > 0) { const c = Math.floor((e.x + e.w - 1) / TS); for (let r = r0; r <= r1; r++) if (solidT(tAt(c, r))) { e.x = c * TS - e.w; e.hitWall = 1; break; } }
  else if (e.vx < 0) { const c = Math.floor(e.x / TS); for (let r = r0; r <= r1; r++) if (solidT(tAt(c, r))) { e.x = (c + 1) * TS; e.hitWall = -1; break; } }
  const pb = e.y + e.h; e.y += e.vy; e.onGround = false;
  const c0 = Math.floor((e.x + 1) / TS), c1 = Math.floor((e.x + e.w - 2) / TS);
  if (e.vy >= 0) {
    const r = Math.floor((e.y + e.h) / TS);
    for (let c = c0; c <= c1; c++) { const ch = tAt(c, r); if (solidT(ch) || (oneWayT(ch) && pb <= r * TS + .01)) { e.y = r * TS - e.h; e.vy = 0; e.onGround = true; break; } }
  } else {
    const r = Math.floor(e.y / TS);
    for (let c = c0; c <= c1; c++) if (solidT(tAt(c, r))) { e.y = (r + 1) * TS; e.vy = 0; break; }
  }
}

  const t = G.stateT, secs = Math.floor(save.time / 60), mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
  ctext('THE KITCHEN IS', 28, '#ffffff', 2); ctext('SPOTLESS!', 48, '#F9C51F', 2);
  const P = { weapon:(t >> 5) % 7, charge:0, knock:0, dead:false, onGround:t % 80 > 20, vx:0, shootT:0, face:1, anim:0 };
  drawSmudge(P, 114, 80 - (t % 80 < 20 ? Math.sin((t % 80) / 20 * Math.PI) * 14 : 0), 1.5);
  ctext('SMUDGE SOAKED UP EVERY MESS', 132, '#B8B4D8');
  ctext('CLEAR TIME ' + mm + ':' + ss, 150, '#6EF29A');
  ctext('THANKS FOR PLAYING', 170, '#ffffff');
  if (t > 90 && (t >> 4) & 1) ctext('PRESS START', 200, '#FFE14D');
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  R(0, 0, W, H, '#000');
  if (G.state === 'title') return renderTitle();
  if (G.state === 'select') return renderSelect();
  if (G.state === 'get') return renderGet();
  if (G.state === 'ending') return renderEnding();
  if (G.state === 'issue') return renderIssue();
  if (G.mode === 'stage' && ['stage', 'sdead', 'gate', 'card'].includes(G.state)) {
    if (G.shake > 0) ctx.setTransform(1, 0, 0, 1, Math.round((rnd() - .5) * 4), Math.round((rnd() - .5) * 3));
    renderStage(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (G.state === 'card') drawTraitCard();
    return;
  }
  if (G.shake > 0) ctx.setTransform(1, 0, 0, 1, Math.round((rnd() - .5) * 4), Math.round((rnd() - .5) * 3));
  drawArena();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ------------------------------------------------------------------ LOOP */
const autoPause = () => { if ((G.state === 'fight' || G.state === 'stage') && !G.paused) { G.paused = true; G.menuIdx = Math.max(0, owned().indexOf(G.P.weapon)); } };
addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { update(); acc -= STEP; }
  musicTick(); render();
  requestAnimationFrame(frame);
}
render(); requestAnimationFrame(frame);
window.__SB = { G, save, BOSSES, startFight, startStage, TRAITS, STAGES };
})();
</script>

<script>
(()=>{if(window.parent===window)return;document.documentElement.classList.add('dots-cab');
 const post=m=>{try{parent.postMessage({dotsArcade:m},'*');}catch(e){}};let held=null;
 addEventListener('keydown',e=>{if(e.key!=='Escape'||e.repeat)return;clearTimeout(held);held=setTimeout(()=>post('exit'),650);},true);
 addEventListener('keyup',e=>{if(e.key==='Escape'){clearTimeout(held);held=null;}},true);
 addEventListener('blur',()=>{clearTimeout(held);held=null;});
 addEventListener('message',e=>{if(e.data&&e.data.dotsArcade==='focus'){try{focus();document.body.focus();}catch(_){}}});
 const fit=()=>{const b=document.body;if(!b)return;b.style.zoom='';const h=Math.max(b.scrollHeight,document.documentElement.scrollHeight),w=Math.max(b.scrollWidth,document.documentElement.scrollWidth);
  const k=Math.min(1,innerHeight/h,innerWidth/w);if(k<.999)b.style.zoom=String(Math.floor(k*1000)/1000);};
 addEventListener('load',()=>{fit();setTimeout(fit,300);post('ready');});addEventListener('resize',fit);
})();
</script></body></html>
